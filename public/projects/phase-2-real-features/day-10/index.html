<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filter UI</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/styles/index.css">
</head>
<body class="bg-light">
    <div class="container-fluid py-5">
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark mb-2">
                <i class="ri-shopping-cart-2-line"></i> Product Store
            </h1>
            <p class="text-muted">Find your favorite products with ease</p>
        </div>

        <div class="row">
            <!-- Sidebar Filters -->
            <div class="col-lg-3 mb-4">
                <div class="filter-container bg-white rounded-3 shadow-sm p-4">
                    <h5 class="fw-bold mb-3 text-dark">
                        <i class="ri-filter-line"></i> Filters
                    </h5>

                    <!-- Search Input -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-dark">Search Products</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="ri-search-line"></i>
                            </span>
                            <input 
                                type="text" 
                                class="form-control border-start-0" 
                                id="searchInput" 
                                placeholder="Search..."
                                aria-label="Search products"
                            >
                        </div>
                    </div>

                    <!-- Category Filter -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">Category</label>
                        <div class="category-buttons d-flex flex-column gap-2">
                            <button class="btn btn-outline-primary category-btn active" data-category="all">
                                All Products
                            </button>
                            <button class="btn btn-outline-primary category-btn" data-category="electronics">
                                <i class="ri-computer-line"></i> Electronics
                            </button>
                            <button class="btn btn-outline-primary category-btn" data-category="clothing">
                                <i class="ri-shirt-2-line"></i> Clothing
                            </button>
                            <button class="btn btn-outline-primary category-btn" data-category="books">
                                <i class="ri-book-line"></i> Books
                            </button>
                            <button class="btn btn-outline-primary category-btn" data-category="accessories">
                                <i class="ri-handbag-line"></i> Accessories
                            </button>
                        </div>
                    </div>

                    <!-- Price Range Filter -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">Price Range</label>
                        <div class="d-flex gap-2 align-items-center mb-2">
                            <input 
                                type="range" 
                                class="form-range" 
                                id="priceRange" 
                                min="0" 
                                max="1000" 
                                value="1000"
                                aria-label="Price range slider"
                            >
                        </div>
                        <div class="text-muted small">
                            Max: $<span id="priceValue">1000</span>
                        </div>
                    </div>

                    <!-- Clear Filters Button -->
                    <button class="btn btn-danger w-100" id="clearFilters">
                        <i class="ri-close-line"></i> Clear All Filters
                    </button>
                </div>
            </div>

            <!-- Products Section -->
            <div class="col-lg-9">
                <!-- Results Count -->
                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <p class="text-muted mb-0">
                        Showing <strong id="resultCount">0</strong> products
                    </p>
                    <div class="sort-options">
                        <select class="form-select form-select-sm w-auto" id="sortOptions" aria-label="Sort products">
                            <option value="default">Sort by: Default</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="name">Name: A to Z</option>
                        </select>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="products-container" id="productsContainer">
                    <!-- Products will be inserted here -->
                </div>

                <!-- No Results Message -->
                <div id="noResults" class="text-center py-5 d-none">
                    <i class="ri-inbox-line" style="font-size: 3rem; color: #ccc;"></i>
                    <p class="text-muted mt-3">No products found. Try adjusting your filters.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="./assets/scripts/index.js"></script>
</body>
</html>
